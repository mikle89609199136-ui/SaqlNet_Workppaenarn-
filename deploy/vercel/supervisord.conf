[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/craneapp-supervisord.pid
childlogdir=/tmp

[program:crypto]
command=/usr/local/bin/crypto-rust
autostart=true
autorestart=true
startretries=10
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

