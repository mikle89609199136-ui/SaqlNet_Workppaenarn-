<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Цвет строки состояния — фон темы; приложение подстраивает его под
         выбранную тему и палитру (#880). -->
    <meta name="theme-color" content="#0f1216">
    <title>CraneApp - Messenger</title>
    <!-- PWA (#880): установка на экран «Домой». -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="CraneApp">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..800&family=JetBrains+Mono:wght@400;500&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    <script>
      /*
        Тема ставится до первой отрисовки, иначе экран мигнёт тёмной темой,
        пока грузится приложение: атрибут в <html> задан по умолчанию, а
        настоящее значение придёт только с ответом сервера.

        Здесь читается проекция настроек — копия того, что уже подтвердил
        сервер. Источник правды не она, а кеш запросов: приложение перезапишет
        атрибут, как только настройки загрузятся.
      */
      (function () {
        try {
          var raw = localStorage.getItem('craneapp_settings');
          var theme = raw && JSON.parse(raw).theme;
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {
          /* приватный режим — останется значение по умолчанию */
        }

        /* Палитра и акцент (#828): пока их хранит только браузер, это не
           проекция, а сам выбор — см. entities/user/model/appearanceStore.
           Незнакомое значение пропускается: без атрибута действует
           палитра и акцент по умолчанию. */
        try {
          var look = JSON.parse(localStorage.getItem('craneapp_appearance') || '{}');
          if (look.palette === 'midnight' || look.palette === 'warm') {
            document.documentElement.setAttribute('data-palette', look.palette);
          }
          if (/^(plum|orchid|indigo|amber|teal)$/.test(look.accent)) {
            document.documentElement.setAttribute('data-accent', look.accent);
          }
        } catch (e) {
          /* приватный режим — палитра и акцент по умолчанию */
        }
      })();
    </script>
</head>
<body>
    <div id="appRoot"></div>
    <script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
