<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Цвет строки состояния — фон темы; приложение подстраивает его под
         выбранную тему и палитру (#880). -->
    <meta name="theme-color" content="#0f1216">
    <title>CraneApp - Messenger</title>
    <!-- PWA (#880): установка на экран «Домой». -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="CraneApp">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..800&family=JetBrains+Mono:wght@400;500&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    <script>
      /* Проекция подтверждённых preferences владельца, до первого paint.
         Не является источником настроек и не отправляется обратно серверу. */
      (function () {
        try {
          var user = JSON.parse(localStorage.getItem('craneapp_user_data') || 'null');
          var look = JSON.parse(localStorage.getItem('craneapp_settings') || 'null');
          if (!user || !look || !user.id || look.ownerId !== user.id) return;
          var root = document.documentElement;
          if (/^(light|dark|system)$/.test(look.theme)) {
            root.setAttribute('data-theme-preference', look.theme);
            root.setAttribute('data-theme', look.theme === 'system'
              ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : look.theme);
          }
          if (/^(graphite|midnight|warm)$/.test(look.palette)) root.setAttribute('data-palette', look.palette);
          if (/^(violet|plum|orchid|indigo|amber|teal)$/.test(look.accentPreset)) root.setAttribute('data-accent', look.accentPreset);
          if (/^(small|medium|large)$/.test(look.textSize)) root.setAttribute('data-text-size', look.textSize);
          if (/^(compact|normal|large)$/.test(look.chatDensity)) root.setAttribute('data-chat-density', look.chatDensity);
        } catch (e) {
          /* Повреждённое/недоступное хранилище: умолчания, затем ответ API. */
        }
      })();
    </script>
</head>
<body>
    <div id="appRoot"></div>
    <script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
