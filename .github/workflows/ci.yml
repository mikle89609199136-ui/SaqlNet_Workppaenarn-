name: CI

# Проверка — на pull request в dev и master. После слияния в dev повторно
# не гоняется: тот же код уже проверен в PR, а повторный прогон съедал
# треть минут Actions (185 из 559 запусков за сентябрь 2026 при лимите
# 2 000 минут в месяц на приватный репозиторий). Push в master проверяется:
# с него идёт деплой.
on:
  pull_request:
    branches:
      - master
      - dev
  push:
    branches:
      - master

permissions:
  contents: read
  # Определение изменённых путей запрашивает список файлов Pull Request через API
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Определяет, каких частей проекта коснулись изменения, чтобы не запускать
  # сборку Go и Rust на правку клиента и наоборот.
  #
  # Изменение самого ci.yml запускает все проверки: иначе ошибку в конфигурации
  # можно внести незаметно.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      crypto: ${{ steps.filter.outputs.crypto }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'backend-v2/contracts/openapi/**'
              - 'backend-v2/internal/platform/settingsdefaults/defaults.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend-v2/**'
              - 'scripts/ci-pin-mtimes.go'
              - '.github/workflows/ci.yml'
            crypto:
              - 'server/crypto-rust/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      # Две глубины истории: в PR проверяется слияние с базовой веткой, и
      # HEAD~1 — её вершина. От неё считаются изменённые файлы.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check User API contract and generated types
        run: |
          npm run api:types
          git diff --exit-code -- src/types/api.generated.ts
          npm run api:check

      # Проверка типов из конвейера убрана: корневой tsconfig — файл-решение
      # со списком проектов и пустым files, поэтому `tsc --noEmit` завершался
      # успехом, не открыв ни одного файла. Шаг занимал место обязательной
      # проверки, ничего при этом не проверяя. Вернуть — вместе с #253.

      # Циклические импорты не ломают сборку, но делают модули непригодными
      # для изолированного тестирования. dpdm учитывает, что import type
      # стирается при компиляции, и не считает такие связи циклами.
      - name: Check for import cycles
        run: npm run check:cycles

      # В PR — только тесты, которые импортируют изменённые файлы (граф
      # импортов vitest). Правка зависимостей, настроек, обвязки тестов,
      # словарей и CSS-токенов запускает весь набор — forceRerunTriggers в
      # vitest.config.js. Push в master — весь набор.
      - name: Run React tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test -- --changed HEAD~1 --passWithNoTests
          else
            npm run test
          fi

      - name: Build frontend
        run: npm run build

      # Правила номера версии выпуска (#892): scripts/release-bump.cjs.
      - name: Release version rules
        working-directory: .
        run: node --test scripts/*.test.cjs

  backend:
    name: Backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend-v2/go.mod
          cache: false

      # Кеш сборки Go хранит и результаты тестов: пакет, у которого не
      # изменились ни код, ни зависимости, ни читаемые тестом файлы
      # (миграции), не перезапускается. Ключ — с коммитом, чтобы каждый
      # прогон сохранял свежий кеш; восстанавливается последний подходящий:
      # свой из этого PR или из master.
      - name: Cache Go build and test results
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('backend-v2/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('backend-v2/go.sum') }}-
            go-${{ runner.os }}-

      # Время изменения файлов — по содержимому: иначе после checkout все
      # файлы «новые», и тесты, читающие миграции или фикстуры, не берутся
      # из кеша никогда (scripts/ci-pin-mtimes.go).
      - name: Pin file times to content
        run: go run ../scripts/ci-pin-mtimes.go .

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet -tags=integration ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend-v2

      # Все тесты одним запуском: тег integration включает и обычные. Каждый
      # интеграционный пакет поднимает один Postgres и копирует для тестов
      # шаблонную базу (dbtest). Без -count=1 — результаты кешируются. Чат
      # (сокет, звонки, отзыв сессий) — с детектором гонок.
      - name: Run Go tests
        run: |
          go test -tags=integration $(go list ./... | grep -v '/internal/chat')
          go test -race -tags=integration ./internal/chat/...

      # Второй слой лимитов MLS в chat: выдача KeyPackage, потолок вызовов crypto (#916).
      - name: Run chat MLS limits integration tests
        run: go test -count=1 -tags=integration -v -run 'TestMLSKeyPackageLimitsOnRealSchema|TestMLSBusyCryptoAnswers503OnCommitWelcomeAndProposals|TestMLSNonMemberIsDeniedBeforeCryptoSlotIsTaken|TestMLSNormalGroupAdditionFitsDefaultLimits|TestMLSUploadIsAtomicWhenCryptoBecomesBusyMidway' ./internal/chat

      - name: Build services
        run: go build ./...

  crypto:
    name: Crypto (Rust)
    needs: changes
    if: needs.changes.outputs.crypto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server/crypto-rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
          rustup default 1.94.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/crypto-rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      # Релизная сборка в PR ничего не добавляет к clippy и тестам: тот же
      # код. Проверяется на push в master, перед деплоем.
      - name: Build release binary
        if: github.event_name == 'push'
        run: cargo build --release --locked

  # Выпуск в master повышает номер версии (#892): версия видна в
  # приложении и в /health/live, и по ней выпуски отличают друг от друга.
  # В PR — сравнение с master; при пуше в master — с тем, что было до него.
  release-version:
    name: Release version
    if: github.base_ref == 'master' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version is bumped
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
        run: node scripts/check-release-version.cjs "$BASE"
