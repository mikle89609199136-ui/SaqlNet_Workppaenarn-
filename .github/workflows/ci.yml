name: CI

# Проверка — на pull request в dev и master. После слияния в dev повторно
# не гоняется: тот же код уже проверен в PR, а повторный прогон съедал
# треть минут Actions (185 из 559 запусков за сентябрь 2026 при лимите
# 2 000 минут в месяц на приватный репозиторий). Push в master проверяется:
# с него идёт деплой.
on:
  pull_request:
    branches:
      - master
      - dev
  push:
    branches:
      - master

permissions:
  contents: read
  # Определение изменённых путей запрашивает список файлов Pull Request через API
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Определяет, каких частей проекта коснулись изменения, чтобы не запускать
  # сборку Go и Rust на правку клиента и наоборот.
  #
  # Изменение самого ci.yml запускает все проверки: иначе ошибку в конфигурации
  # можно внести незаметно.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      crypto: ${{ steps.filter.outputs.crypto }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend-v2/**'
              - '.github/workflows/ci.yml'
            crypto:
              - 'server/crypto-rust/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Проверка типов из конвейера убрана: корневой tsconfig — файл-решение
      # со списком проектов и пустым files, поэтому `tsc --noEmit` завершался
      # успехом, не открыв ни одного файла. Шаг занимал место обязательной
      # проверки, ничего при этом не проверяя. Вернуть — вместе с #253.

      # Циклические импорты не ломают сборку, но делают модули непригодными
      # для изолированного тестирования. dpdm учитывает, что import type
      # стирается при компиляции, и не считает такие связи циклами.
      - name: Check for import cycles
        run: npm run check:cycles

      - name: Run React tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      # Правила номера версии выпуска (#892): scripts/release-bump.cjs.
      - name: Release version rules
        working-directory: .
        run: node --test scripts/*.test.cjs

  backend:
    name: Backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend-v2/go.mod
          cache: true
          cache-dependency-path: backend-v2/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend-v2

      - name: Run Go tests
        run: go test -v ./...

      - name: Run auth revocation integration tests
        run: |
          go test -count=1 -tags=integration -v ./internal/platform/authctx
          go test -race -count=1 -tags=integration -v -run '^TestActiveWSLogoutAcrossReplicas$' ./internal/chat

      # Все миграции на настоящем Postgres: по одному разу на чистой базе и
      # повторный прогон с данными — так приходят базы, созданные до
      # schema_migrations. Неповторяемая миграция упадёт здесь, а не у
      # разработчиков на стенде.
      - name: Run migration integration tests
        run: go test -count=1 -tags=integration -v ./cmd/migrate

      # Единая проверка приватности, исключения по людям и настоящий SQL
      # статуса, данных чата, рассылки присутствия и списка «в сети» в группе
      # (#783, #784).
      - name: Run privacy integration tests
        run: |
          go test -count=1 -tags=integration -v ./internal/platform/privacy
          go test -count=1 -tags=integration -v -run 'TestPresenceAudienceOnRealSchema|TestOnlineMembersOnRealSchema|TestBlockOnRealSchema|TestSendBatchOnRealSchema|TestDeleteMessagesOnRealSchema|TestMediaAttachmentOnRealSchema|TestTypingOnRealSchema|TestMarkReadOnRealSchema|TestReceiptsOnRealSchema|TestReceiptsMigrationBackfill|TestSharedMediaOnRealSchema|TestCallRoomAccessOnRealSchema|TestCallSignalOnRealSchema|TestCallInviteOnRealSchema|TestCallRoomBlockedOnRealSchema|TestCallRoomOneToOneOnRealSchema|TestCallPeerLeftReasonOnRealSchema|TestCallHistoryOnRealSchema|TestCallRestoreAfterRestartOnRealSchema' ./internal/chat

      # Web Push: подписки устройств и получатели уведомлений (#717).
      - name: Run push integration tests
        run: go test -count=1 -tags=integration -v -run 'TestPushOnRealSchema' ./internal/push

      # Смена ключа группы: пометка при изменении состава, атомарная запись
      # новой эпохи и одновременные смены (#806).
      - name: Run chat key rotation integration tests
        run: go test -count=1 -tags=integration -v -run 'TestKeyRotationOnRealSchema' ./internal/chat

      - name: Build services
        run: go build ./...

  crypto:
    name: Crypto (Rust)
    needs: changes
    if: needs.changes.outputs.crypto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server/crypto-rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
          rustup default 1.94.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

  # Выпуск в master повышает номер версии (#892): версия видна в
  # приложении и в /health/live, и по ней выпуски отличают друг от друга.
  # В PR — сравнение с master; при пуше в master — с тем, что было до него.
  release-version:
    name: Release version
    if: github.base_ref == 'master' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version is bumped
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
        run: node scripts/check-release-version.cjs "$BASE"
