name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  # Определение изменённых путей запрашивает список файлов Pull Request через API
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Определяет, каких частей проекта коснулись изменения, чтобы не запускать
  # сборку Go и Rust на правку клиента и наоборот.
  #
  # Изменение самого ci.yml запускает все проверки: иначе ошибку в конфигурации
  # можно внести незаметно.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      crypto: ${{ steps.filter.outputs.crypto }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend-v2/**'
              - '.github/workflows/ci.yml'
            crypto:
              - 'server/crypto-rust/**'
              - '.github/workflows/ci.yml'

  # Проверка размеров файлов охватывает client, database, docs, infrastructure,
  # public, scripts и server, поэтому выполняется всегда и не зависит от фильтров.
  # Зависимости для неё не нужны — скрипт использует только стандартную библиотеку.
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run architecture checks
        run: node scripts/checkArchitecture.js

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run React tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend-v2/go.mod
          cache: true
          cache-dependency-path: backend-v2/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test -v ./...

      - name: Build services
        run: go build ./...

  crypto:
    name: Crypto (Rust)
    needs: changes
    if: needs.changes.outputs.crypto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server/crypto-rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
          rustup default 1.94.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked
