/auth/register:
  post:
    tags: [Auth]
    summary: Register a user
    operationId: register
    requestBody: { required: true, content: { application/json: { schema: { $ref: '../components/schemas.yaml#/RegisterRequest' } } } }
    responses:
      '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' }
      '201': { description: Registered, headers: { Set-Cookie: { description: 'Session cookie (sessionCookie) with the issued token, HttpOnly', schema: { type: string } } }, content: { application/json: { schema: { $ref: '../components/schemas.yaml#/AuthResponse' } } } }
      '400': { $ref: '../components/responses.yaml#/Error' }
      '409': { $ref: '../components/responses.yaml#/Error' }
/auth/login:
  post:
    tags: [Auth]
    summary: Authenticate a user
    operationId: login
    requestBody: { required: true, content: { application/json: { schema: { $ref: '../components/schemas.yaml#/LoginRequest' } } } }
    responses:
      '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' }
      '200':
        description: Authenticated (session cookie is set) or 2FA challenge
        headers: { Set-Cookie: { description: 'Session cookie (sessionCookie) with the issued token, HttpOnly', schema: { type: string } } }
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '../components/schemas.yaml#/AuthResponse' }
                - type: object
                  required: [twoFARequired, userId]
                  properties:
                    twoFARequired: { type: boolean, enum: [true] }
                    userId: { type: string, format: uuid }
      '401': { $ref: '../components/responses.yaml#/Error' }
/auth/public-key:
  post:
    tags: [Auth]
    summary: Save the authenticated user's public key
    operationId: saveAuthPublicKey
    security: [{ sessionCookie: [] }]
    requestBody:
      required: true
      content: { application/json: { schema: { type: object, required: [publicKey], properties: { publicKey: { type: string } } } } }
    responses: { '200': { description: Saved }, '400': { $ref: '../components/responses.yaml#/Error' }, '401': { $ref: '../components/responses.yaml#/Error' }, '500': { $ref: '../components/responses.yaml#/Error' }, '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' } }
/auth/qr-token:
  post:
    tags: [Auth]
    summary: Start a QR login or replace the code
    description: >-
      Called by the device that wants to log in. publicKey is a one-time ECDH
      public key; the signed-in device encrypts the key backup master key to it.
      The client draws the QR code itself. The code lives 60 seconds; the device
      replaces it every 30 seconds by passing the previous token and its secret.
      The client builds the QR URL as <frontend-origin>/link#t=<qrToken>&k=<publicKey>,
      with fragment values encoded by URLSearchParams and the one-time public key in base64url SPKI.
      /link is a frontend landing page outside the session guard, not an API endpoint.
      It preserves the link in tab sessionStorage while signing in when necessary, then
      inspects the pending request and requires explicit confirmation. The fragment is
      removed from the address bar; the secret must never be included in the QR URL.
      The secret is never drawn into the QR code. A scanned code cannot be
      replaced (409 qr_scanned).
    operationId: createQrToken
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrTokenRequest' } } }
    responses:
      '200':
        description: QR login started
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrTokenResponse' } } }
      '400': { $ref: '../components/responses.yaml#/Error' }
      '403': { $ref: '../components/responses.yaml#/Error' }
      '409': { $ref: '../components/responses.yaml#/Error' }
/auth/qr-token/{token}:
  delete:
    tags: [Auth]
    summary: Withdraw a QR code
    description: Called when the page showing the code goes away. Needs the secret from creation; an unknown code is ignored.
    operationId: cancelQrToken
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrSecretRequest' } } }
    responses:
      '204': { description: Withdrawn }
      '400': { $ref: '../components/responses.yaml#/Error' }
      '403': { $ref: '../components/responses.yaml#/Error' }
/auth/qr-request/{token}:
  get:
    tags: [Auth]
    summary: Show which device asks to log in
    description: >-
      For the signed-in device before it confirms. The first account to call it
      captures the code for 60 seconds; for everyone else the code is gone.
      404 qr_rotated means the code was replaced by a newer one, invalid_token
      that it expired or was used. Not cacheable.
    operationId: getQrRequest
    security: [{ sessionCookie: [] }]
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    responses:
      '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' }
      '200':
        description: Pending QR login
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrLoginRequest' } } }
      '401': { $ref: '../components/responses.yaml#/Error' }
      '404': { $ref: '../components/responses.yaml#/Error' }
  delete:
    tags: [Auth]
    summary: Decline a scanned QR login
    description: Drops a code this account captured; the device showing it draws a new one.
    operationId: declineQrRequest
    security: [{ sessionCookie: [] }]
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    responses:
      '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' }
      '204': { description: Declined }
      '401': { $ref: '../components/responses.yaml#/Error' }
/auth/qr-status/{token}:
  get:
    tags: [Auth]
    summary: Get QR login status
    description: >-
      Polled by the new device with the secret from creation in X-QR-Secret.
      scanned means another device captured the code and the person is deciding.
      A confirmed status sets the session cookie and carries the encrypted
      payload once; later polls report expired. Not cacheable.
    operationId: getQrStatus
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - { name: X-QR-Secret, in: header, required: true, schema: { type: string } }
    responses:
      '200':
        description: Pending, scanned, confirmed, or expired QR login status; confirmed sets the session cookie
        headers: { Set-Cookie: { description: 'Session cookie (sessionCookie) with the issued token, HttpOnly', schema: { type: string } } }
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrStatusResponse' } } }
      '403': { $ref: '../components/responses.yaml#/Error' }
/auth/qr-confirm:
  post:
    tags: [Auth]
    summary: Confirm a QR login
    description: >-
      Only the account that captured the code with GET /auth/qr-request can
      confirm it (403 not_scanned). A code can be confirmed only once; a second
      confirmation gets 409 already_confirmed.
      Called by the signed-in frontend after the person confirms a link opened at
      /link#t=<qrToken>&k=<publicKey>. Requires a session cookie and a JSON body;
      it is not a navigable GET URL and does not accept a query token. Opening the
      QR link must navigate to /link, never to this API operation. The client first
      inspects /auth/qr-request/{token} and checks its public key against the fragment.
    operationId: confirmQrLogin
    security: [{ sessionCookie: [] }]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrConfirmRequest' } } }
    responses:
      '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' }
      '200': { description: Confirmed }
      '400': { $ref: '../components/responses.yaml#/Error' }
      '403': { $ref: '../components/responses.yaml#/Error' }
      '409': { $ref: '../components/responses.yaml#/Error' }
/auth/qr-offer:
  post:
    tags: [Auth]
    summary: Show a login code on a signed-in device
    description: >-
      The other direction of QR login: the signed-in device shows the code and
      the new device scans it. The QR code also carries a one-time ECDH public
      key of the signed-in device and a MAC key; both stay after "#" and never
      reach the server. Same lifetime rules as qr-token: 60 seconds, replaced
      every 30 by passing the previous token; a claimed code is not replaced
      (409 qr_scanned).
    operationId: createQrOffer
    security: [{ sessionCookie: [] }]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrOfferRequest' } } }
    responses:
      '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' }
      '200':
        description: Code created
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrOfferResponse' } } }
      '400': { $ref: '../components/responses.yaml#/Error' }
      '401': { $ref: '../components/responses.yaml#/Error' }
      '403': { $ref: '../components/responses.yaml#/Error' }
      '409': { $ref: '../components/responses.yaml#/Error' }
/auth/qr-offer/{token}:
  get:
    tags: [Auth]
    summary: Check whether a new device claimed the code
    description: >-
      For the owner of the code. A claim carries the new device's public key
      and the HMAC over it, which the owner checks with the MAC key from the QR
      code before confirming. Somebody else's code reports expired. Not cacheable.
    operationId: getQrOffer
    security: [{ sessionCookie: [] }]
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    responses:
      '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' }
      '200':
        description: Offer state
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrOfferState' } } }
      '401': { $ref: '../components/responses.yaml#/Error' }
  delete:
    tags: [Auth]
    summary: Withdraw the code
    description: The page showing it went away, or the person declined the claim.
    operationId: withdrawQrOffer
    security: [{ sessionCookie: [] }]
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    responses:
      '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' }
      '204': { description: Withdrawn }
      '401': { $ref: '../components/responses.yaml#/Error' }
/auth/qr-offer/{token}/claim:
  post:
    tags: [Auth]
    summary: Claim a login code from the new device
    description: >-
      The first claim captures the code for 60 seconds; later claims get 404.
      404 qr_rotated means the code was replaced by a newer one. The answer
      carries the secret for polling the result. Not cacheable.
    operationId: claimQrOffer
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrOfferClaimRequest' } } }
    responses:
      '200':
        description: Claimed
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrOfferClaimResponse' } } }
      '400': { $ref: '../components/responses.yaml#/Error' }
      '404': { $ref: '../components/responses.yaml#/Error' }
/auth/qr-offer/{token}/status:
  get:
    tags: [Auth]
    summary: Get the result of a claimed code
    description: >-
      Polled by the new device with the claim secret in X-QR-Secret. A confirmed
      status sets the session cookie and carries the encrypted payload once;
      later polls, a declined or an expired code report expired. Not cacheable.
    operationId: getQrOfferStatus
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - { name: X-QR-Secret, in: header, required: true, schema: { type: string } }
    responses:
      '200':
        description: Pending, confirmed, or expired; confirmed sets the session cookie
        headers: { Set-Cookie: { description: 'Session cookie (sessionCookie) with the issued token, HttpOnly', schema: { type: string } } }
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrOfferStatusResponse' } } }
      '403': { $ref: '../components/responses.yaml#/Error' }
/auth/qr-offer/{token}/confirm:
  post:
    tags: [Auth]
    summary: Confirm the claimed login
    description: >-
      Only the owner of the code, only after a claim (409 not_claimed) and only
      once (409 already_confirmed). payload is the master key encrypted to the
      claimed public key.
    operationId: confirmQrOffer
    security: [{ sessionCookie: [] }]
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrOfferConfirmRequest' } } }
    responses:
      '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' }
      '200': { description: Confirmed }
      '400': { $ref: '../components/responses.yaml#/Error' }
      '401': { $ref: '../components/responses.yaml#/Error' }
      '404': { $ref: '../components/responses.yaml#/Error' }
      '409': { $ref: '../components/responses.yaml#/Error' }
/auth/logout:
  post:
    tags: [Auth]
    summary: Revoke the current token
    operationId: logout
    security: [{ sessionCookie: [] }]
    responses: { '200': { description: Logged out; the session cookie is cleared }, '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' } }
/auth/logout-all:
  post:
    tags: [Auth]
    summary: Revoke all user tokens
    description: May return 503 while generation revocation is disabled during a compatibility rollout.
    operationId: logoutAll
    security: [{ sessionCookie: [] }]
    responses:
      '200': { description: All sessions revoked; the session cookie is cleared }
      '401': { $ref: '../components/responses.yaml#/Error' }
      '503': { $ref: '../components/responses.yaml#/Error' }
/auth/sessions:
  get:
    tags: [Auth]
    summary: List authenticated sessions
    description: Canonical active credential sessions, sharing stable IDs with /users/devices. isCurrent belongs to the request cookie. Unregistered legacy tokens require a fresh login.
    operationId: listAuthSessions
    security: [{ sessionCookie: [] }]
    responses:
      '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' }
      '200':
        description: Active sessions with the current credential first, then by recent activity
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/AuthSessionsResponse' }
      '401': { $ref: '../components/responses.yaml#/Error' }
/auth/change-password:
  post:
    tags: [Auth]
    summary: Change password
    operationId: changePassword
    security: [{ sessionCookie: [] }]
    requestBody:
      required: true
      content: { application/json: { schema: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string, format: password }, newPassword: { $ref: '../components/schemas.yaml#/Password' } } } } }
    responses: { '200': { description: Password changed }, '400': { $ref: '../components/responses.yaml#/Error' }, '401': { $ref: '../components/responses.yaml#/Error' }, '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' } }
/auth/2fa/status:
  get:
    tags: [Auth]
    summary: Get 2FA status
    operationId: getTwoFactorStatus
    security: [{ sessionCookie: [] }]
    responses: { '200': { description: 2FA status }, '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' } }
/auth/2fa/enable:
  post:
    tags: [Auth]
    summary: Enable 2FA
    operationId: enableTwoFactor
    security: [{ sessionCookie: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password], properties: { password: { $ref: '../components/schemas.yaml#/Password' } } } } } }
    responses: { '200': { description: 2FA enabled }, '400': { $ref: '../components/responses.yaml#/Error' }, '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' } }
/auth/2fa/disable:
  post:
    tags: [Auth]
    summary: Disable 2FA
    operationId: disableTwoFactor
    security: [{ sessionCookie: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string, format: password } } } } } }
    responses: { '200': { description: 2FA disabled }, '400': { $ref: '../components/responses.yaml#/Error' }, '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' } }
/auth/2fa/verify:
  post:
    tags: [Auth]
    summary: Verify 2FA password
    operationId: verifyTwoFactor
    security: [{ sessionCookie: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string, format: password } } } } } }
    responses: { '200': { description: Verification result }, '401': { $ref: '../components/responses.yaml#/Error' }, '503': { $ref: '../components/responses.yaml#/CryptoUnavailable' } }
