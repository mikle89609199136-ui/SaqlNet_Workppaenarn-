/auth/qr-token:
  post:
    tags: [Auth]
    summary: Start a QR login or replace the code
    description: >-
      Called by the device that wants to log in. publicKey is a one-time ECDH
      public key; the signed-in device encrypts the key backup master key to it.
      The client draws the QR code itself. The code lives 60 seconds; the device
      replaces it every 30 seconds by passing the previous token and its secret.
      The client builds the QR URL as <frontend-origin>/link#t=<qrToken>&k=<publicKey>,
      with fragment values encoded by URLSearchParams and the one-time public key in base64url SPKI.
      /link is a frontend landing page outside the session guard, not an API endpoint.
      It preserves the link in tab sessionStorage while signing in when necessary, then
      inspects the pending request and requires explicit confirmation. The fragment is
      removed from the address bar; the secret must never be included in the QR URL.
      The secret is never drawn into the QR code. A scanned code cannot be
      replaced (409 qr_scanned).
    operationId: createQrToken
    x-body-limit-bytes: 16384
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrTokenRequest' } } }
    security: []
    x-error-codes:
      '400': [invalid_json, validation_failed]
      '403': [cross_site_request, invalid_secret]
      '405': [method_not_allowed]
      '409': [qr_scanned]
      '429': [rate_limited]
      '500': [internal_error]
      '502': [upstream_unavailable]
    responses:
      '200': {description: QR login started, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/QrTokenResponse}}}}
      '400': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [invalid_json, validation_failed]}}}]}}}}
      '403': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [cross_site_request, invalid_secret]}}}]}}}}
      '405': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [method_not_allowed]}}}]}}}}
      '409': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [qr_scanned]}}}]}}}}
      '429': {description: Edge rate limit exceeded; Retry-After is seconds., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [rate_limited]}}}]}}}, headers: {Retry-After: {schema: {type: integer, minimum: 1}, description: Seconds to wait before retrying.}}}
      '500': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [internal_error]}}}]}}}}
      '502': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [upstream_unavailable]}}}]}}}}
/auth/qr-token/{token}:
  delete:
    tags: [Auth]
    summary: Withdraw a QR code
    description: Called when the page showing the code goes away. Needs the secret from creation; an unknown code is ignored.
    operationId: cancelQrToken
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    x-body-limit-bytes: 16384
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrSecretRequest' } } }
    security: []
    x-error-codes:
      '400': [invalid_json]
      '403': [cross_site_request, invalid_secret]
      '405': [method_not_allowed]
      '429': [rate_limited]
      '502': [upstream_unavailable]
    responses:
      '204': {description: Withdrawn}
      '400': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [invalid_json]}}}]}}}}
      '403': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [cross_site_request, invalid_secret]}}}]}}}}
      '405': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [method_not_allowed]}}}]}}}}
      '429': {description: Edge rate limit exceeded; Retry-After is seconds., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [rate_limited]}}}]}}}, headers: {Retry-After: {schema: {type: integer, minimum: 1}, description: Seconds to wait before retrying.}}}
      '502': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [upstream_unavailable]}}}]}}}}
/auth/qr-request/{token}:
  get:
    tags: [Auth]
    summary: Show which device asks to log in
    description: >-
      For the signed-in device before it confirms. The first account to call it
      captures the code for 60 seconds; for everyone else the code is gone.
      404 qr_rotated means the code was replaced by a newer one, invalid_token
      that it expired or was used. Not cacheable.
    operationId: getQrRequest
    security: [{ sessionCookie: [] }]
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    x-error-codes:
      '401': [invalid_token, missing_token, token_revoked]
      '404': [invalid_token, qr_rotated]
      '429': [rate_limited]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]
      '405': [method_not_allowed]
    responses:
      '405': { description: Unsupported method, content: { application/json: { schema: { allOf: [ { $ref: '../components/schemas.yaml#/Error' }, { type: object, properties: { code: { type: string, enum: [method_not_allowed] } } } ] } } } }
      '200': {description: Pending QR login, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/QrLoginRequest}}}}
      '401': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [invalid_token, missing_token, token_revoked]}}}]}}}}
      '404': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [invalid_token, qr_rotated]}}}]}}}}
      '429': {description: Edge rate limit exceeded; Retry-After is seconds., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [rate_limited]}}}]}}}, headers: {Retry-After: {schema: {type: integer, minimum: 1}, description: Seconds to wait before retrying.}}}
      '502': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [upstream_unavailable]}}}]}}}}
      '503': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]}}}]}}}}
  delete:
    tags: [Auth]
    summary: Decline a scanned QR login
    description: Drops a code this account captured; the device showing it draws a new one.
    operationId: declineQrRequest
    security: [{ sessionCookie: [] }]
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    x-error-codes:
      '401': [invalid_token, missing_token, token_revoked]
      '403': [cross_site_request]
      '429': [rate_limited]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]
      '405': [method_not_allowed]
    responses:
      '405': { description: Unsupported method, content: { application/json: { schema: { allOf: [ { $ref: '../components/schemas.yaml#/Error' }, { type: object, properties: { code: { type: string, enum: [method_not_allowed] } } } ] } } } }
      '204': {description: Declined}
      '401': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [invalid_token, missing_token, token_revoked]}}}]}}}}
      '403': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [cross_site_request]}}}]}}}}
      '429': {description: Edge rate limit exceeded; Retry-After is seconds., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [rate_limited]}}}]}}}, headers: {Retry-After: {schema: {type: integer, minimum: 1}, description: Seconds to wait before retrying.}}}
      '502': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [upstream_unavailable]}}}]}}}}
      '503': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]}}}]}}}}
/auth/qr-status/{token}:
  get:
    tags: [Auth]
    summary: Get QR login status
    description: >-
      Polled by the new device with the secret from creation in X-QR-Secret.
      scanned means another device captured the code and the person is deciding.
      A confirmed status sets the session cookie and carries the encrypted
      payload once; later polls report expired. Not cacheable.
    operationId: getQrStatus
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - { name: X-QR-Secret, in: header, required: true, schema: { type: string } }
    security: []
    x-error-codes:
      '400': [invalid_request]
      '403': [invalid_secret]
      '405': [method_not_allowed]
      '429': [rate_limited]
      '502': [upstream_unavailable]
    responses:
      '200': {description: 'Pending, scanned, confirmed, or expired QR login status; confirmed sets the session cookie', headers: {Set-Cookie: {description: 'Session cookie (sessionCookie) with the issued token, HttpOnly', schema: {type: string}}}, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/QrStatusResponse}}}}
      '400': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [invalid_request]}}}]}}}}
      '403': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [invalid_secret]}}}]}}}}
      '405': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [method_not_allowed]}}}]}}}}
      '429': {description: Edge rate limit exceeded; Retry-After is seconds., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [rate_limited]}}}]}}}, headers: {Retry-After: {schema: {type: integer, minimum: 1}, description: Seconds to wait before retrying.}}}
      '502': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [upstream_unavailable]}}}]}}}}
/auth/qr-confirm:
  post:
    tags: [Auth]
    summary: Confirm a QR login
    description: >-
      Only the account that captured the code with GET /auth/qr-request can
      confirm it (403 not_scanned). A code can be confirmed only once; a second
      confirmation gets 409 already_confirmed.
      Called by the signed-in frontend after the person confirms a link opened at
      /link#t=<qrToken>&k=<publicKey>. Requires a session cookie and a JSON body;
      it is not a navigable GET URL and does not accept a query token. Opening the
      QR link must navigate to /link, never to this API operation. The client first
      inspects /auth/qr-request/{token} and checks its public key against the fragment.
    operationId: confirmQrLogin
    security: [{ sessionCookie: [] }]
    x-body-limit-bytes: 16384
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../components/schemas.yaml#/QrConfirmRequest' } } }
    x-error-codes:
      '400': [invalid_json, invalid_request, invalid_token, validation_failed]
      '401': [invalid_token, missing_token, token_revoked]
      '403': [cross_site_request, not_scanned]
      '405': [method_not_allowed]
      '409': [already_confirmed]
      '429': [rate_limited]
      '500': [internal_error]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable, token_issuer_not_ready]
    responses:
      '200': {description: Confirmed, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/Success}}}}
      '400': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [invalid_json, invalid_request, invalid_token, validation_failed]}}}]}}}}
      '401': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [invalid_token, missing_token, token_revoked]}}}]}}}}
      '403': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [cross_site_request, not_scanned]}}}]}}}}
      '405': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [method_not_allowed]}}}]}}}}
      '409': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [already_confirmed]}}}]}}}}
      '429': {description: Edge rate limit exceeded; Retry-After is seconds., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [rate_limited]}}}]}}}, headers: {Retry-After: {schema: {type: integer, minimum: 1}, description: Seconds to wait before retrying.}}}
      '500': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [internal_error]}}}]}}}}
      '502': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [upstream_unavailable]}}}]}}}}
      '503': {description: Auth or edge error; see code enum., content: {application/json: {schema: {allOf: [{$ref: ../components/schemas.yaml#/Error}, {type: object, properties: {code: {type: string, enum: [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable, token_issuer_not_ready]}}}]}}}}
/auth/qr-offer:
  post:
    tags: [Auth]
    summary: Show a login code on a signed-in device
    description: >-
      The other direction of QR login: the signed-in device shows the code and
      the new device scans it. The QR code also carries a one-time ECDH public
      key of the signed-in device and a MAC key; both stay after "#" and never
      reach the server. Same lifetime rules as qr-token: 60 seconds, replaced
      every 30 by passing the previous token; a claimed code is not replaced
