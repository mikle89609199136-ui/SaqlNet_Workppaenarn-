x-secure: &secure [{ sessionCookie: [] }]
x-error: &error { $ref: '../components/responses.yaml#/Error' }

/messages/read:
  post:
    tags: [Messages]
    summary: Mark messages as read
    description: >-
      Marks the given messages of the chat as read (#506). The chat keeps one
      read boundary (unread counts use it): it moves to the newest of the
      counted messages — incoming and not deleted — and never moves back, so
      newer messages stay unread. To mark the whole chat, use
      POST /chats/{chatId}/read. A moved boundary is journaled: the authors see
      readAt on their messages and get the receipts event (ReceiptEvent, #657).
    operationId: markMessagesRead
    security: *secure
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/MarkMessagesReadRequest' }
    responses:
      '200':
        description: Messages marked as read
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ReadMark' }
      '400': *error
      '403': *error

/messages/search:
  get:
    tags: [Messages]
    summary: Search messages
    operationId: searchMessages
    security: *secure
    parameters:
      - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    responses:
      '200':
        description: Matching messages
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/MessageListResponse' }
      '400': *error
      '500': *error
/messages/{messageId}/location:
  parameters:
    - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
  get:
    tags: [Messages]
    summary: Chat of a message
    description: >-
      Which chat a message is in (#1076): a message forwarded to Saved Messages
      keeps the original message id, but not its chat. Only for a current
      member of that chat; deleted and hidden-for-me messages are not found.
      Every refusal is the same 404 message_not_found, so the answer reveals
      nothing about messages of other chats.
    operationId: getMessageLocation
    security: *secure
    responses:
      '200':
        description: Chat of the message
        content:
          application/json:
            schema:
              type: object
              required: [chatId]
              properties:
                chatId: { type: string, format: uuid }
      '400': *error
      '404': *error
      '500': *error

/messages/favorites:
  get:
    tags: [Messages]
    summary: List favorite messages
    operationId: listFavoriteMessages
    security: *secure
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    responses:
      '200':
        description: Favorite messages
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/MessageListResponse' }
      '400': *error
      '500': *error

/messages/{id}:
  parameters:
    - name: id
      in: path
      required: true
      description: Chat ID for GET/POST; message ID for PUT/DELETE.
      schema: { type: string, format: uuid }
  get:
    tags: [Messages]
    summary: List messages in a chat
    operationId: listMessages
    security: *secure
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    responses:
      '200':
        description: Chat messages
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/MessageListResponse' }
      '400': *error
      '403': *error
      '404': *error
      '500': *error
  post:
    tags: [Messages]
    summary: Send messages to a chat
    operationId: sendMessages
    security: *secure
    description: >-
      Always a batch, even for one message (#808). Messages are stored in one
      transaction in the given order: either all of them or none. A forward is
      an item with forwardedFrom whose content the client has already
      re-encrypted for this chat. An error about a particular item carries its
      position in details.index. 403 member_muted when the sender is muted;
      403 blocked_by_user when the other member of a private chat has blocked
      the sender — nothing is stored or delivered. One new_message event per
      message, in order, after the commit. Sticker and GIF mediaUrl must be a
      relative /api/v2/media/{uuid} path to an available catalog item; external
      URLs and encrypted catalog objects are rejected. Stickers cannot have
      content or entities. Other attachments must remain the sender's own
      uploads (#871). Catalog metadata uses the message type as mediaType.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/SendMessagesRequest' }
    responses:
      '201':
        description: Sent messages, in the order of the request
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/MessageListResponse' }
      '400': *error
      '403': *error
      '404': *error
      '500': *error
  put:
    tags: [Messages]
    summary: Edit a message
    operationId: editMessage
    security: *secure
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/EditMessageRequest' }
    responses:
      '200':
        description: Edited message
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Message' }
      '400': *error
      '404': *error
      '500': *error
  delete:
    tags: [Messages]
    summary: Delete a message for everyone
    description: Alias of a single forEveryone delete. Use POST /chats/{chatId}/messages/delete.
    deprecated: true
    operationId: deleteMessage
    security: *secure
    responses:
      '200':
        description: Message deleted
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/DeleteMessageResponse' }
      '400': *error
      '403': *error
      '404': *error
      '500': *error

/messages/{messageId}/reactions:
  parameters:
    - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
  get:
    tags: [Messages]
    summary: List reactions
    operationId: listMessageReactions
    security: *secure
    responses:
      '200':
        description: Aggregated reactions
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ReactionListResponse' }
      '400': *error
      '403': *error
      '404': *error
      '500': *error
  post:
    tags: [Messages]
    summary: Toggle a reaction
    operationId: toggleMessageReaction
    security: *secure
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [emoji]
            properties:
              emoji: { type: string, minLength: 1 }
    responses:
      '200':
        description: Updated reaction state
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ReactionToggleResponse' }
      '400': *error
      '403': *error
      '404': *error
      '500': *error

/messages/{messageId}/reactions/users:
  get:
    tags: [Messages]
    summary: Authors of one reaction on a message
    description: >-
      Paginated list of chat members who reacted to a message with the given
      emoji (#709). Each item is a minimal public profile of the author; the
      avatar is empty when the author's photoVisibility rule (with the block
      list and exceptions) hides the photo from the caller. Only current
      members of the chat get a result; a stranger or a former member gets
      403, a non-existent, deleted, or hidden message gets 404. Ordering is stable
      newest-first, (created_at DESC, user_id DESC); pass nextCursor as
      cursor for the next page. total is the count of this emoji on the
      message and matches Reaction.count — the author list is not filtered
      by privacy, only the avatar is.
    operationId: listReactionAuthors
    security: *secure
    parameters:
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: emoji
        in: query
        required: true
        description: >-
          Exactly one emoji string. Same validation as POST
          /messages/{messageId}/reactions: at most 64 UTF-8 bytes and no
          HTML-hostile characters (< > " ' & / \).
        schema: { type: string, minLength: 1, maxLength: 64 }
      - name: cursor
        in: query
        required: false
        description: nextCursor of the previous page; omit for the newest authors.
        schema: { type: string }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    responses:
      '200':
        description: A page of reaction authors
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/ReactionAuthorsPage' } } }
      '400':
        description: 'validation_failed: invalid messageId, missing or duplicated emoji, invalid limit, or a malformed cursor.'
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Error' }
            examples:
              emojiMissing:
                value: { code: validation_failed, message: emoji required }
              emojiDuplicated:
                value: { code: validation_failed, message: emoji required }
              badCursor:
                value: { code: validation_failed, message: invalid input }
              badLimit:
                value: { code: validation_failed, message: invalid limit }
      '403':
        description: 'access_denied: the caller is not a member of the chat (or left it).'
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/Error' } } }
      '404':
        description: 'not_found: the message does not exist, is deleted, or is hidden from the caller.'
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/Error' } } }
      '405':
        description: Method not allowed
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/Error' } } }
      '500':
        description: Internal server error
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/Error' } } }

/messages/{messageId}/favorite:
  parameters:
    - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
  post:
    tags: [Messages]
    summary: Toggle favorite state
    description: The current backend toggles the state for both POST and DELETE and returns the resulting state.
    operationId: favoriteMessage
    security: *secure
    responses:
      '200':
        description: Resulting favorite state
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/FavoriteStateResponse' }
      '500': *error
  delete:
    tags: [Messages]
    summary: Toggle favorite state
    description: The current backend toggles the state for both POST and DELETE and returns the resulting state.
    operationId: unfavoriteMessage
    security: *secure
    responses:
      '200':
        description: Resulting favorite state
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/FavoriteStateResponse' }
      '500': *error
