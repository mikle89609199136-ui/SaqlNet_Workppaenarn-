/users/all-settings:
  get:
    deprecated: true
    description: >-
      Deprecated compatibility snapshot (#498/#454). Use GET /users/settings for MVP settings/privacy.
      Passcode fields are read-only; exceptions, blocklist, subscriptions and sessions are separate resources.
      Sound aliases are resolved from canonical flags by #1042 (#496); compatibility-only details remain stored.
    tags:
      - Users
    summary: Get legacy settings snapshot
    operationId: getAllSettings
    security:
      - {sessionCookie: []}
    responses:
      '200': {description: 'Complete compatibility envelope, not a revision or replacement command', content: {application/json: {schema: {$ref: ../components/schemas.yaml#/LegacySettingsSnapshot}}}}
      '401': {$ref: ../components/responses.yaml#/UserUnauthorized}
      '405': {$ref: ../components/responses.yaml#/UserMethodNotAllowed}
      '429': {$ref: ../components/responses.yaml#/UserRateLimited}
      '500': {$ref: ../components/responses.yaml#/UserInternalError}
      '502': {$ref: ../components/responses.yaml#/UserBadGateway}
      '503': {$ref: ../components/responses.yaml#/UserUnavailable}
    x-error-codes:
      '401': [missing_token, invalid_token, token_revoked]
      '405': [method_not_allowed]
      '429': [rate_limited]
      '500': [internal_error]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]
  put:
    deprecated: true
    description: >-
      Deprecated partial bulk update (#454), NOT replace. Each provided object section is shallow-merged;
      omitted, null or empty object sections do not reset values. A provided folders array replaces the list
      (empty clears), omission/null preserves it. Correctly typed passcode fields are accepted but ignored for
      legacy snapshot compatibility. Response stays success only; GET separately for the resulting snapshot.
      Submitted textSize wins over submitted fontSize; otherwise a submitted fontSize sets textSize (#1040).
      Both fields are validated, including the losing alias. Arbitrary accentColor stays compatibility data.
      Bulk and legacy section read-modify-write share a row-locked transaction (#1047), preserving disjoint
      concurrent patches. Row creation and all section changes roll back on update or commit failure.
      Strict root/section/leaf validation runs before SQL
      (#495). Canonical sound flags win over aliases as specified in #496/#1042; conflicting submitted message aliases without canonical sounds
      fail without writes.
    tags:
      - Users
    summary: Partially update legacy settings sections
    operationId: updateAllSettings
    security:
      - {sessionCookie: []}
    requestBody:
      required: true
      description: 'At most 128 KiB JSON body; exactly one JSON value with no trailing data. Decoder errors, including body limit and trailing data, return 400 invalid_json.'
      content: {application/json: {schema: {$ref: ../components/schemas.yaml#/LegacySettingsBulkPatch}}}
    responses:
      '200': {description: Compatibility acknowledgement; does not contain a settings snapshot, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/LegacySettingsBulkUpdateResult}}}}
      '400': {$ref: ../components/responses.yaml#/UserInvalidInput}
      '401': {$ref: ../components/responses.yaml#/UserUnauthorized}
      '403': {$ref: ../components/responses.yaml#/UserForbidden}
      '405': {$ref: ../components/responses.yaml#/UserMethodNotAllowed}
      '429': {$ref: ../components/responses.yaml#/UserRateLimited}
      '500': {$ref: ../components/responses.yaml#/UserInternalError}
      '502': {$ref: ../components/responses.yaml#/UserBadGateway}
      '503': {$ref: ../components/responses.yaml#/UserUnavailable}
    x-error-codes:
      '400': [invalid_json, validation_failed]
      '401': [missing_token, invalid_token, token_revoked]
      '403': [cross_site_request]
      '405': [method_not_allowed]
      '429': [rate_limited]
      '500': [internal_error]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]
/users/settings:
  get:
    tags:
      - Users
    summary: Get own account settings and privacy
    operationId: getSettings
    security:
      - {sessionCookie: []}
    description: >-
      Canonical MVP settings read (#498). Returns the authenticated owner's settings and privacy in separate
      objects; never another user's settings. Detailed legacy notification/sound/storage sections are not
      included. Typed field contract is #453; shared read defaults are implemented in #451. Appearance compatibility (#1040) resolves a valid stored
      textSize before legacy fontSize and the default, without backfill. One-time notification migration and alias projections are implemented by #1042.
    responses:
      '200': {description: Own account settings and privacy, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/SettingsResponse}}}}
      '401': {$ref: ../components/responses.yaml#/UserUnauthorized}
      '405': {$ref: ../components/responses.yaml#/UserMethodNotAllowed}
      '429': {$ref: ../components/responses.yaml#/UserRateLimited}
      '500': {$ref: ../components/responses.yaml#/UserInternalError}
      '502': {$ref: ../components/responses.yaml#/UserBadGateway}
      '503': {$ref: ../components/responses.yaml#/UserUnavailable}
    x-error-codes:
      '401': [missing_token, invalid_token, token_revoked]
      '405': [method_not_allowed]
      '429': [rate_limited]
      '500': [internal_error]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]
  put:
    tags:
      - Users
    summary: Partially update own account settings
    operationId: updateSettings
    security:
      - {sessionCookie: []}
    description: >-
      Canonical MVP preference write (#498). Send a flat partial JSON object, for example {"theme":"light"},
      not an envelope with a settings key. Omitted keys are preserved; merging is shallow, not JSON Merge
      Patch. Returns the resulting settings object in a settings envelope. Privacy is changed only via PUT
      /users/privacy. Typed keys are fixed in #453 and validated before SQL (#495). Stored legacy data is
      normalized on reads; shared read defaults are implemented in #451. Appearance compatibility is
      implemented in #1040; notification migration/resolver are implemented by #1042.
      Notification preferences are stored in settings.notifications/sounds/callSounds (#496). Legacy sound
      aliases and read normalization are implemented by #1042; browser fallback/ringtone consumers remain #725.
    requestBody:
      required: true
      description: 'At most 128 KiB JSON body; exactly one JSON value with no trailing data. Decoder errors, including body limit and trailing data, return 400 invalid_json.'
      content: {application/json: {schema: {$ref: ../components/schemas.yaml#/MvpSettings}}}
    responses:
      '200': {description: Resulting account settings, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/SettingsUpdateResponse}}}}
      '400': {$ref: ../components/responses.yaml#/UserInvalidInput}
      '401': {$ref: ../components/responses.yaml#/UserUnauthorized}
      '403': {$ref: ../components/responses.yaml#/UserForbidden}
      '405': {$ref: ../components/responses.yaml#/UserMethodNotAllowed}
      '429': {$ref: ../components/responses.yaml#/UserRateLimited}
      '500': {$ref: ../components/responses.yaml#/UserInternalError}
      '502': {$ref: ../components/responses.yaml#/UserBadGateway}
      '503': {$ref: ../components/responses.yaml#/UserUnavailable}
    x-error-codes:
      '400': [invalid_json, validation_failed]
      '401': [missing_token, invalid_token, token_revoked]
      '403': [cross_site_request]
      '405': [method_not_allowed]
      '429': [rate_limited]
      '500': [internal_error]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]
/users/privacy:
  put:
    tags:
      - Users
    summary: Partially update own privacy rules
    operationId: updatePrivacy
    security:
      - {sessionCookie: []}
    description: >-
      Canonical MVP privacy write (#498); read via GET /users/settings. Send a flat partial object, not a
      privacy envelope. Omitted rules are preserved; merging is shallow. Returns the resulting privacy object.
      Unknown keys or values are rejected with 400 validation_failed. Visibility rules take all or nobody; the
      legacy contacts and none are accepted and stored as nobody, everyone as all. Exceptions remain separate
      resources under /users/privacy/exceptions and are not replaced by this update. State-changing cookie
      requests require an allowed Origin.
    requestBody:
      required: true
      description: 'At most 128 KiB JSON body; exactly one JSON value with no trailing data. Decoder errors, including body limit and trailing data, return 400 invalid_json.'
      content: {application/json: {schema: {$ref: ../components/schemas.yaml#/PrivacySettingsPatch}}}
    responses:
      '200': {description: Resulting privacy rules, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/PrivacyUpdateResponse}}}}
      '400': {$ref: ../components/responses.yaml#/UserInvalidInput}
      '401': {$ref: ../components/responses.yaml#/UserUnauthorized}
      '403': {$ref: ../components/responses.yaml#/UserForbidden}
      '405': {$ref: ../components/responses.yaml#/UserMethodNotAllowed}
      '429': {$ref: ../components/responses.yaml#/UserRateLimited}
      '500': {$ref: ../components/responses.yaml#/UserInternalError}
      '502': {$ref: ../components/responses.yaml#/UserBadGateway}
      '503': {$ref: ../components/responses.yaml#/UserUnavailable}
    x-error-codes:
      '400': [invalid_json, validation_failed]
      '401': [missing_token, invalid_token, token_revoked]
      '403': [cross_site_request]
      '405': [method_not_allowed]
      '429': [rate_limited]
      '500': [internal_error]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]
