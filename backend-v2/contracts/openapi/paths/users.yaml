x-secure: &secure
  - sessionCookie: []
x-error: &error
  $ref: '../components/responses.yaml#/Error'
/users/me:
  get:
    tags: [Users]
    summary: Get current profile
    operationId: getCurrentUser
    security: *secure
    responses: { '200': { description: Profile }, '401': *error }
  put:
    tags: [Users]
    summary: Update current profile
    operationId: updateCurrentUser
    security: *secure
    requestBody:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: '../components/schemas.yaml#/UpdateProfileRequest' } },
          },
      }
    responses: { '200': { description: Updated profile }, '400': *error }
/users/me/username:
  put:
    tags: [Users]
    summary: Change the current user's username
    description: >-
      Normalizes the username to lowercase and changes it atomically. A successful
      change invalidates old username deep links; user IDs and existing chats remain
      unchanged. The operation is limited to once every 24 hours.
    operationId: renameCurrentUser
    security: *secure
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/RenameUsernameRequest' }
    responses:
      '200':
        description: Updated canonical profile
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ProfileResponse' }
      '400': *error
      '401': *error
      '409': *error
      '429':
        description: Rename cooldown is active; Retry-After contains seconds remaining
        headers:
          Retry-After: { schema: { type: integer, minimum: 1 } }
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Error' }
/users/avatar:
  put:
    tags: [Users]
    summary: Update avatar
    operationId: updateAvatar
    security: *secure
    requestBody:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    properties: { avatar: { type: string }, avatarUrl: { type: string } },
                  },
              },
          },
      }
    responses: { '200': { description: Updated profile } }
/users/check-username:
  get:
    tags: [Users]
    summary: Check username availability
    operationId: checkUsername
    parameters:
      [
        {
          name: username,
          in: query,
          required: true,
          schema: { $ref: '../components/schemas.yaml#/Username' },
        },
      ]
    responses:
      '200':
        description: Availability
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties: { available: { type: boolean } }
      '400': *error
      '429': *error
/users/search:
  get:
    tags: [Users]
    summary: Search users
    operationId: searchUsers
    security: *secure
    parameters: [{ name: q, in: query, schema: { type: string } }]
    responses: { '200': { description: Search results } }
/users/qr-code:
  get:
    tags: [Users]
    summary: Generate a profile QR code
    operationId: getUserQrCode
    security: *secure
    parameters: [{ name: username, in: query, required: true, schema: { type: string } }]
    responses: { '200': { description: QR code data URL }, '404': *error }
/users/{userId}/profile:
  get:
    tags: [Users]
    summary: Get a public profile
    operationId: getPublicProfile
    security: *secure
    parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
    responses: { '200': { description: Public profile }, '404': *error }
/users/{userId}/status:
  get:
    tags: [Users]
    summary: Get user presence status
    operationId: getUserStatus
    security: *secure
    parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
    responses:
      '200':
        description: User status as the caller may see it
        content: { application/json: { schema: { $ref: '../components/schemas.yaml#/UserStatus' } } }
      '404':
        description: User not found
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Error' }
            example: { code: user_not_found, message: user not found }
/premium/subscribe:
  post:
    tags: [Users]
    summary: Subscribe to premium
    operationId: subscribePremium
    security: *secure
    responses: { '200': { description: Subscribed } }
/users/all-settings:
  get:
    deprecated: true
    description: >-
      Deprecated compatibility snapshot (#498/#454). Use GET /users/settings
      for MVP settings/privacy. Passcode fields are read-only; exceptions,
      blocklist, subscriptions and sessions are separate resources.
      After #1042, sound aliases are resolved from canonical flags (#496).
    tags: [Users]
    summary: Get legacy settings snapshot
    operationId: getAllSettings
    security: *secure
    responses:
      '200':
        description: Complete compatibility envelope, not a revision or replacement command
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/LegacySettingsSnapshot' }
      '401': { $ref: '../components/responses.yaml#/Error' }
      '405': { $ref: '../components/responses.yaml#/Error' }
      '500': { $ref: '../components/responses.yaml#/Error' }
      '503': { $ref: '../components/responses.yaml#/Error' }
  put:
    deprecated: true
    description: >-
      Deprecated partial bulk update (#454), NOT replace. Each provided object
      section is shallow-merged; omitted, null or empty object sections do not
      reset values. A provided folders array replaces the list (empty clears),
      omission/null preserves it. Correctly typed passcode fields are accepted
      but ignored for legacy snapshot compatibility. Response stays success
      only; GET separately for the resulting snapshot. Safe concurrent writes
      require a shared locked transaction for bulk and section read-modify-write;
      the current service can still lose parallel updates. Strict root/section
      validation requires #495. After #1042, canonical sound flags win over
      aliases as specified in #496; conflicting aliases fail without writes.
    tags: [Users]
    summary: Partially update legacy settings sections
    operationId: updateAllSettings
    security: *secure
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/LegacySettingsBulkPatch' }
    responses:
      '200':
        description: Compatibility acknowledgement; does not contain a settings snapshot
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/LegacySettingsBulkUpdateResult' }
      '400': { $ref: '../components/responses.yaml#/Error' }
      '401': { $ref: '../components/responses.yaml#/Error' }
      '403': { $ref: '../components/responses.yaml#/Error' }
      '405': { $ref: '../components/responses.yaml#/Error' }
      '500': { $ref: '../components/responses.yaml#/Error' }
      '503': { $ref: '../components/responses.yaml#/Error' }
/users/settings:
  get:
    tags: [Users]
    summary: Get own account settings and privacy
    operationId: getSettings
    security: *secure
    description: >-
      Canonical MVP settings read (#498). Returns the authenticated owner's
      settings and privacy in separate objects; never another user's settings.
      Detailed legacy notification/sound/storage sections are not included.
      Field schemas and consistent defaults are tracked in #453 and #451.
    responses:
      '200':
        description: Own account settings and privacy
        content:
          application/json:
            schema:
              type: object
              required: [settings, privacy]
              properties:
                settings: { $ref: '../components/schemas.yaml#/MvpSettings' }
                privacy: { $ref: '../components/schemas.yaml#/PrivacySettings' }
      '401': { $ref: '../components/responses.yaml#/Error' }
      '405': { $ref: '../components/responses.yaml#/Error' }
      '500': { $ref: '../components/responses.yaml#/Error' }
      '503': { $ref: '../components/responses.yaml#/Error' }
  put:
    tags: [Users]
    summary: Partially update own account settings
    operationId: updateSettings
    security: *secure
    description: >-
      Canonical MVP preference write (#498). Send a flat partial JSON object,
      for example {"theme":"light"}, not an envelope with a settings key.
      Omitted keys are preserved; merging is shallow, not JSON Merge Patch.
      Returns the resulting settings object in a settings envelope. Privacy
      is changed only via PUT /users/privacy. Typed keys, null/unknown-key
      validation and legacy normalization require #453/#495; the current
      generic settings handler does not enforce that validation yet.
      Notification preferences are stored in settings.notifications/sounds/callSounds (#496). Legacy sound aliases and read normalization require #1042; consumers apply effective policy in #725.
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../components/schemas.yaml#/MvpSettings' } } }
    responses:
      '200':
        description: Resulting account settings
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { $ref: '../components/schemas.yaml#/MvpSettings' }
      '400': { $ref: '../components/responses.yaml#/Error' }
      '401': { $ref: '../components/responses.yaml#/Error' }
      '403': { $ref: '../components/responses.yaml#/Error' }
      '405': { $ref: '../components/responses.yaml#/Error' }
      '500': { $ref: '../components/responses.yaml#/Error' }
      '503': { $ref: '../components/responses.yaml#/Error' }
/users/privacy:
  put:
    tags: [Users]
    summary: Partially update own privacy rules
    operationId: updatePrivacy
    security: *secure
    description: >-
      Canonical MVP privacy write (#498); read via GET /users/settings.
      Send a flat partial object, not a privacy envelope. Omitted rules are
      preserved; merging is shallow. Returns the resulting privacy object.
      Unknown keys or values are rejected with 400 validation_failed.
      Visibility rules take all or nobody; the legacy contacts and none
      are accepted and stored as nobody, everyone as all. Exceptions remain
      separate resources under /users/privacy/exceptions and are not replaced
      by this update. State-changing cookie requests require an allowed Origin.
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../components/schemas.yaml#/PrivacySettings' } } }
    responses:
      '200':
        description: Resulting privacy rules
        content:
          application/json:
            schema:
              type: object
              required: [privacy]
              properties: { privacy: { $ref: '../components/schemas.yaml#/PrivacySettings' } }
      '400': { $ref: '../components/responses.yaml#/Error' }
      '401': { $ref: '../components/responses.yaml#/Error' }
      '403': { $ref: '../components/responses.yaml#/Error' }
      '405': { $ref: '../components/responses.yaml#/Error' }
      '500': { $ref: '../components/responses.yaml#/Error' }
      '503': { $ref: '../components/responses.yaml#/Error' }
/users/privacy/exceptions:
  get:
    tags: [Users]
    summary: List privacy exceptions
    operationId: listPrivacyExceptions
    security: *secure
    description: >-
      People the owner let see a closed rule (allow) or hid an open one from
      (deny), newest first. Without rule, exceptions of every rule.
    parameters:
      - name: rule
        in: query
        required: false
        schema: { $ref: '../components/schemas.yaml#/PrivacyExceptionRule' }
    responses:
      '200':
        description: Privacy exceptions
        content:
          application/json:
            schema:
              type: object
              required: [exceptions]
              properties:
                exceptions:
                  type: array
                  items: { $ref: '../components/schemas.yaml#/PrivacyException' }
      '400': { $ref: '../components/responses.yaml#/Error' }
/users/privacy/exceptions/{rule}/{userId}:
  parameters:
    - name: rule
      in: path
      required: true
      schema: { $ref: '../components/schemas.yaml#/PrivacyExceptionRule' }
    - name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
  put:
    tags: [Users]
    summary: Add or switch a privacy exception
    operationId: setPrivacyException
    security: *secure
    description: >-
      One exception per person and rule: putting someone on the allow list
      moves them off the deny list. Order of the check: the owner themself,
      the block list, the exception, the rule. Yourself is 400
      self_exception; an unknown or disabled user is 404 user_not_found.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [mode]
            additionalProperties: false
            properties: { mode: { $ref: '../components/schemas.yaml#/PrivacyExceptionMode' } }
    responses:
      '200':
        description: Saved exception
        content:
          application/json:
            schema:
              type: object
              required: [exception]
              properties: { exception: { $ref: '../components/schemas.yaml#/PrivacyException' } }
      '400': { $ref: '../components/responses.yaml#/Error' }
      '404': { $ref: '../components/responses.yaml#/Error' }
  delete:
    tags: [Users]
    summary: Remove a privacy exception
    operationId: removePrivacyException
    security: *secure
    description: Removing an exception that is not there is not an error.
    responses:
      '200': { description: Removed }
      '400': { $ref: '../components/responses.yaml#/Error' }
