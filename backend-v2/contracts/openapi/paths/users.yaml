/users/push/vapid-key:
  get:
    tags: [Users]
    summary: Web Push VAPID public key
    description: >-
      Public VAPID key for PushManager.subscribe (applicationServerKey).
      404 push_not_configured when push notifications are disabled on this
      server.
    operationId: getPushVapidKey
    security: *secure
    responses:
      '200':
        description: Public key
        content:
          application/json:
            schema:
              type: object
              required: [publicKey]
              properties:
                publicKey: { type: string, description: 'Base64url, uncompressed P-256 point' }
      '404': { description: Push notifications are not configured }
/users/push/subscriptions:
  post:
    tags: [Users]
    summary: Register this device for Web Push
    description: >-
      Saves the PushSubscription of the current device. Repeating the same
      endpoint updates the keys; an endpoint registered by another account on
      the same device moves to the current account. The endpoint must be an
      https address of a known push service (Google, Mozilla, Apple,
      Microsoft) — the server sends requests to it. At most 20 subscriptions
      per user; older ones are evicted. Push payloads never contain message
      text (end-to-end encryption): only the event kind, chat id, chat type
      and title, the sender name and the recipient language.
    operationId: savePushSubscription
    security: *secure
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [endpoint, keys]
            properties:
              endpoint: { type: string, format: uri, maxLength: 2048 }
              keys:
                type: object
                required: [p256dh, auth]
                properties:
                  p256dh: { type: string, description: 'Base64url, 65-byte P-256 public key' }
                  auth: { type: string, description: 'Base64url, 16-byte auth secret' }
    responses:
      '200':
        description: Saved; the id is sent over the socket in client_state so that a visible device gets no push
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      '400': { description: invalid_json or invalid_push_subscription }
  delete:
    tags: [Users]
    summary: Remove the Web Push subscription of this device
    operationId: deletePushSubscription
    security: *secure
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [endpoint]
            properties:
              endpoint: { type: string }
    responses:
      '204': { description: Removed (only the requester's own subscription) }
      '400': { description: endpoint is required }
/users/devices/terminate-all:
  post:
    tags: [Users]
    summary: Revoke all other sessions
    description: Immediately revokes tokens and closes sockets of every other active session. Preserves the request cookie session. Use /auth/logout-all to revoke every session including the caller.
    operationId: terminateAllDevices
    security: *secure
    responses:
      '200': { description: Other sessions revoked }
      '401': *error
/users/devices/{sessionId}:
  delete:
    tags: [Users]
    summary: Delete a device session
    description: >-
      Revokes the canonical auth session and immediately invalidates its token and
      WebSocket connections on all replicas. Other device metadata is preserved.
      The current session cannot be terminated
      through this endpoint: it returns 409 conflict_current_session — log out
      to end the current session.
    operationId: deleteDevice
    security: *secure
    parameters:
      [
        {
          name: sessionId,
          description: Canonical ID from /auth/sessions or /users/devices.,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    responses:
      '200':
        description: Deleted
        content:
          application/json:
            schema:
              type: object
              required: [success]
              properties: { success: { type: boolean, example: true } }
      '400':
        description: sessionId is not a valid UUID
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Error' }
      '404': *error
      '409':
        description: sessionId is the current session
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Error' }
            example:
              {
                code: conflict_current_session,
                message: cannot terminate current session,
              }
