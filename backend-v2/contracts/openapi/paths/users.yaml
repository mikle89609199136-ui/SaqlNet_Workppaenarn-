/users/search:
  get:
    tags:
      - Users
    summary: Search users
    operationId: searchUsers
    security:
      - {sessionCookie: []}
    parameters:
      - {name: q, in: query, schema: {type: string}}
    responses:
      '200': {description: Search results, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/UserSearchResponse}}}}
      '401': {$ref: ../components/responses.yaml#/UserUnauthorized}
      '405': {$ref: ../components/responses.yaml#/UserMethodNotAllowed}
      '429': {$ref: ../components/responses.yaml#/UserRateLimited}
      '500': {$ref: ../components/responses.yaml#/UserInternalError}
      '502': {$ref: ../components/responses.yaml#/UserBadGateway}
      '503': {$ref: ../components/responses.yaml#/UserUnavailable}
    description: >-
      Case-insensitive literal substring search across username, first/last name and bio; trims whitespace and
      an optional leading @. Percent/underscore are literal. Excludes caller and disabled users, sorted by
      username, at most 50 results, no pagination. Empty query and no matches both return users as [], never
      null.
    x-error-codes:
      '401': [missing_token, invalid_token, token_revoked]
      '405': [method_not_allowed]
      '429': [rate_limited]
      '500': [internal_error]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]
/users/qr-code:
  get:
    tags:
      - Users
    summary: Generate a profile QR code
    operationId: getUserQrCode
    security:
      - {sessionCookie: []}
    parameters:
      - {name: username, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 64, description: Trimmed and lowercased for lookup; canonical output username comes from the existing profile.}}
    responses:
      '200': {description: QR code data URL, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/ProfileQrResponse}}}}
      '400': {$ref: ../components/responses.yaml#/UserInvalidParameter}
      '401': {$ref: ../components/responses.yaml#/UserUnauthorized}
      '404': {$ref: ../components/responses.yaml#/UserNotFound}
      '405': {$ref: ../components/responses.yaml#/UserMethodNotAllowed}
      '429': {$ref: ../components/responses.yaml#/UserRateLimited}
      '500': {$ref: ../components/responses.yaml#/UserInternalError}
      '502': {$ref: ../components/responses.yaml#/UserBadGateway}
      '503': {$ref: ../components/responses.yaml#/UserUnavailable}
    description: >-
      Looks up the exact existing normalized username. Returns a PNG data URL encoding a profile link. Chosen
      canonical pattern is trusted-public-origin/user/@{canonicalUsername}; username comes from the stored
      profile, not caller spelling. Current handler still trusts Host/X-Forwarded-Proto (#452), and React has
      no profile-link landing route; see docs/user-api-contract.md. This is unrelated to QR login.
    x-error-codes:
      '400': [validation_failed]
      '401': [missing_token, invalid_token, token_revoked]
      '404': [user_not_found]
      '405': [method_not_allowed]
      '429': [rate_limited]
      '500': [internal_error]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]
