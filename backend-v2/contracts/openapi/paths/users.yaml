    summary: Register this device for Web Push
    description: >-
      Saves the PushSubscription of the current device. Repeating the same endpoint updates the keys; an
      endpoint registered by another account on the same device moves to the current account. The endpoint
      must be an https address of a known push service (Google, Mozilla, Apple, Microsoft) — the server sends
      requests to it. At most 20 subscriptions per user; older ones are evicted. Push payloads never contain
      message text (end-to-end encryption): only the event kind, chat id, chat type and title, the sender name
      and the recipient language.
