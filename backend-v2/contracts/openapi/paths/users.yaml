# USER-D001 (#453): all User API operations. Runtime gaps are explicit; schemas do not implement validators.
/users/me:
  get:
    tags:
      - Users
    summary: Get current profile
    operationId: getCurrentUser
    security:
      - {sessionCookie: []}
    responses:
      '200': {description: Profile, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/ProfileResponse}}}}
      '401': {$ref: ../components/responses.yaml#/UserUnauthorized}
      '404': {$ref: ../components/responses.yaml#/UserNotFound}
      '405': {$ref: ../components/responses.yaml#/UserMethodNotAllowed}
      '429': {$ref: ../components/responses.yaml#/UserRateLimited}
      '500': {$ref: ../components/responses.yaml#/UserInternalError}
      '502': {$ref: ../components/responses.yaml#/UserBadGateway}
      '503': {$ref: ../components/responses.yaml#/UserUnavailable}
    x-error-codes:
      '401': [missing_token, invalid_token, token_revoked]
      '404': [user_not_found]
      '405': [method_not_allowed]
      '429': [rate_limited]
      '500': [internal_error]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]
  put:
    tags:
      - Users
    summary: Update current profile
    operationId: updateCurrentUser
    security:
      - {sessionCookie: []}
    requestBody:
      required: true
      description: 'At most 128 KiB JSON body; exactly one JSON value with no trailing data. Decoder errors, including body limit and trailing data, return 400 invalid_json.'
      content: {application/json: {schema: {$ref: ../components/schemas.yaml#/UpdateProfileRequest}}}
    responses:
      '200': {description: Updated profile, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/ProfileResponse}}}}
      '400': {$ref: ../components/responses.yaml#/UserInvalidJson}
      '401': {$ref: ../components/responses.yaml#/UserUnauthorized}
      '403': {$ref: ../components/responses.yaml#/UserForbidden}
      '404': {$ref: ../components/responses.yaml#/UserNotFound}
      '405': {$ref: ../components/responses.yaml#/UserMethodNotAllowed}
      '429': {$ref: ../components/responses.yaml#/UserRateLimited}
      '500': {$ref: ../components/responses.yaml#/UserInternalError}
      '502': {$ref: ../components/responses.yaml#/UserBadGateway}
      '503': {$ref: ../components/responses.yaml#/UserUnavailable}
    x-error-codes:
      '400': [invalid_json]
      '401': [missing_token, invalid_token, token_revoked]
      '403': [cross_site_request]
      '404': [user_not_found]
      '405': [method_not_allowed]
      '429': [rate_limited]
      '500': [internal_error]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]
/users/me/username:
  put:
    tags:
      - Users
    summary: Change the current user's username
    description: >-
      Normalizes the username to lowercase and changes it atomically. A successful change invalidates old
      username deep links; user IDs and existing chats remain unchanged. The operation is limited to once
      every 24 hours.
    operationId: renameCurrentUser
    security:
      - {sessionCookie: []}
    requestBody:
      required: true
      description: 'At most 128 KiB JSON body; exactly one JSON value with no trailing data. Decoder errors, including body limit and trailing data, return 400 invalid_json.'
      content: {application/json: {schema: {$ref: ../components/schemas.yaml#/RenameUsernameRequest}}}
    responses:
      '200': {description: Updated canonical profile, content: {application/json: {schema: {$ref: ../components/schemas.yaml#/ProfileResponse}}}}
      '400': {$ref: ../components/responses.yaml#/UserInvalidJson}
      '401': {$ref: ../components/responses.yaml#/UserUnauthorized}
      '403': {$ref: ../components/responses.yaml#/UserForbidden}
      '404': {$ref: ../components/responses.yaml#/UserNotFound}
      '405': {$ref: ../components/responses.yaml#/UserMethodNotAllowed}
      '409': {$ref: ../components/responses.yaml#/UserUsernameConflict}
      '429': {$ref: ../components/responses.yaml#/UserRenameRateLimited}
      '500': {$ref: ../components/responses.yaml#/UserInternalError}
      '502': {$ref: ../components/responses.yaml#/UserBadGateway}
      '503': {$ref: ../components/responses.yaml#/UserUnavailable}
    x-error-codes:
      '400': [invalid_json]
      '401': [missing_token, invalid_token, token_revoked]
      '403': [cross_site_request]
      '404': [user_not_found]
      '405': [method_not_allowed]
      '409': [username_taken]
      '429': [rate_limited, username_change_cooldown]
      '500': [internal_error]
      '502': [upstream_unavailable]
      '503': [auth_check_unavailable, crypto_protocol_not_ready, crypto_unavailable]
