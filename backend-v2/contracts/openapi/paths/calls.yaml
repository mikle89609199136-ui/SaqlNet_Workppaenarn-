x-secure: &secure [{ sessionCookie: [] }]
x-error: &error { $ref: '../components/responses.yaml#/Error' }

/calls/ice-servers:
  get:
    tags: [Calls]
    summary: Get ICE servers
    operationId: getIceServers
    security: *secure
    responses:
      '200':
        description: ICE configuration
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/IceConfiguration' }

/calls/rooms:
  post:
    tags: [Calls]
    summary: Create a call room
    description: "Self chats do not support calls and return 400 invalid_chat_type. In a private chat where the peer has blocked the caller, the answer is 403 blocked_by_user and no room is created. Calls are one-to-one: in a group or a channel the answer is 400 group_calls_unavailable."
    operationId: createCallRoom
    security: *secure
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/CallRoomCreateRequest' }
    responses:
      '201':
        description: Created call room
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/CallRoomResponse' }
      '400': *error
      '403': *error
      '500': *error

/calls/rooms/{id}:
  get:
    tags: [Calls]
    summary: Get an active call room
    description: "Only members of the room's chat get the room. For anyone else, and for a room that does not exist, the answer is the same 404 room_not_found."
    operationId: getCallRoom
    security: *secure
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    responses:
      '200':
        description: Call room and ICE configuration
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/CallRoomResponse' }
      '404': *error

/calls/history:
  get:
    tags: [Calls]
    summary: List finished calls of the current user
    description: "Newest first. Outgoing calls are listed always; incoming ones only when the invitation reached the user. Status is from the viewer's side: an unanswered outgoing call is cancelled (rejected when the peer declined or was busy), an unanswered incoming call is missed (rejected when the viewer declined). The peer's avatar follows the peer's photo privacy rule. Calls in progress are not listed."
    operationId: getCallHistory
    security: *secure
    parameters:
      - { name: cursor, in: query, required: false, description: "nextCursor of the previous page, opaque.", schema: { type: string } }
      - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      - { name: kind, in: query, required: false, schema: { type: string, enum: [audio, video] } }
      - { name: status, in: query, required: false, schema: { type: string, enum: [answered, missed, rejected, cancelled] } }
    responses:
      '200':
        description: A page of finished calls
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/CallHistoryResponse' }
      '400': *error
      '401': *error
