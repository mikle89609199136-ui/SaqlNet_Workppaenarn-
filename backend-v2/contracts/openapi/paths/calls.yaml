x-secure: &secure [{ sessionCookie: [] }, { bearerAuth: [] }]
x-error: &error { $ref: '../components/responses.yaml#/Error' }

/calls/ice-servers:
  get:
    tags: [Calls]
    summary: Get ICE servers
    operationId: getIceServers
    security: *secure
    responses:
      '200':
        description: ICE configuration
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/IceConfiguration' }

/calls/rooms:
  get:
    tags: [Calls]
    summary: List active in-memory call rooms
    operationId: listCallRooms
    security: *secure
    responses:
      '200':
        description: Active call rooms
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/CallRoomListResponse' }
  post:
    tags: [Calls]
    summary: Create a call room
    description: Self chats do not support calls and return 400 invalid_chat_type.
    operationId: createCallRoom
    security: *secure
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/CallRoomCreateRequest' }
    responses:
      '201':
        description: Created call room
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/CallRoomResponse' }
      '400': *error
      '403': *error
      '500': *error

/calls/rooms/{id}:
  get:
    tags: [Calls]
    summary: Get an active call room
    operationId: getCallRoom
    security: *secure
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    responses:
      '200':
        description: Call room and ICE configuration
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/CallRoomResponse' }
      '404': *error
