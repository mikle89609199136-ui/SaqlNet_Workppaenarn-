x-secure: &secure [{ sessionCookie: [] }]
/media:
  post:
    tags: [Media]
    summary: Upload media
    operationId: uploadMedia
    security: *secure
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
        application/json:
          schema:
            oneOf:
              - type: object
                required: [file]
                properties: { file: { type: string, description: Data URL }, fileName: { type: string } }
              - $ref: '../components/schemas.yaml#/EncryptedMediaUploadRequest'
    responses: { '201': { description: Uploaded, content: { application/json: { schema: { $ref: '../components/schemas.yaml#/UploadResponse' } } } }, '400': { $ref: '../components/responses.yaml#/Error' }, '413': { $ref: '../components/responses.yaml#/FileTooLarge' }, '415': { $ref: '../components/responses.yaml#/Error' } }
/media/{uploadId}:
  parameters: [{ name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }]
  get:
    tags: [Media]
    summary: Download media
    operationId: getMedia
    parameters: [{ name: Range, in: header, required: false, schema: { type: string } }]
    responses:
      '200':
        description: Media stream, or encrypted media metadata and ciphertext
        headers:
          Accept-Ranges: { schema: { type: string } }
          Content-Length: { schema: { type: integer, format: int64 } }
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
          application/json: { schema: { $ref: '../components/schemas.yaml#/Object' } }
      '206': { description: Partial media stream }
      '404': { $ref: '../components/responses.yaml#/Error' }
      '416': { description: Requested range is not satisfiable }
      '502': { $ref: '../components/responses.yaml#/Error' }
  head:
    tags: [Media]
    summary: Get media headers
    operationId: headMedia
    responses:
      '200': { description: Media headers }
      '206': { description: Partial media headers }
      '404': { $ref: '../components/responses.yaml#/Error' }
      '416': { description: Requested range is not satisfiable }
      '502': { $ref: '../components/responses.yaml#/Error' }
/emojis:
  get: { tags: [Media], summary: List emoji, operationId: listEmojis, responses: { '200': { description: Emoji assets } } }
/gifs:
  get: { tags: [Media], summary: List GIFs, operationId: listGifs, security: *secure, responses: { '200': { description: GIFs } } }
  post:
    tags: [Media]
    summary: Create a GIF
    description: >-
      Accepts an unencrypted image/gif upload owned by the caller. Request bodies are limited to 64 KiB.
      Errors: 400 invalid_json, missing_url, invalid_url, validation_failed, invalid_gif_source;
      404 upload_not_found (including uploads owned by another user);
      413 request_too_large; 500 internal_error.
    operationId: createGif
    security: *secure
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              name:
                type: string
                maxLength: 255
                description: Optional name, trimmed before saving; empty is allowed. At most 255 Unicode code points after trimming, without control characters.
              url:
                type: string
                maxLength: 2048
                pattern: '^/api/v2/media/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    responses:
      '201': { description: Created GIF }
      '400': { $ref: '../components/responses.yaml#/Error' }
      '404': { $ref: '../components/responses.yaml#/Error' }
      '413': { $ref: '../components/responses.yaml#/RequestTooLarge' }
      '500': { $ref: '../components/responses.yaml#/Error' }
/gifs/favorites:
  get: { tags: [Media], summary: List favorite GIFs, operationId: listFavoriteGifs, security: *secure, responses: { '200': { description: Favorite GIFs } } }
/gifs/{gifId}/favorite:
  parameters: [{ name: gifId, in: path, required: true, schema: { type: string, format: uuid } }]
  post: { tags: [Media], summary: Favorite a GIF, operationId: favoriteGif, security: *secure, responses: { '201': { description: Favorited } } }
  delete: { tags: [Media], summary: Unfavorite a GIF, operationId: unfavoriteGif, security: *secure, responses: { '200': { description: Unfavorited } } }
/stickers/packs:
  get: { tags: [Media], summary: List sticker packs, operationId: listStickerPacks, security: *secure, responses: { '200': { description: Sticker packs } } }
  post: { tags: [Media], summary: Create a sticker pack, operationId: createStickerPack, security: *secure, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, description: { type: string }, icon: { type: string, format: byte } } } } } }, responses: { '201': { description: Created pack } } }
/stickers/packs/{packId}:
  parameters: [{ name: packId, in: path, required: true, schema: { type: string, format: uuid } }]
  get: { tags: [Media], summary: List stickers in a pack, operationId: listStickers, security: *secure, responses: { '200': { description: Stickers } } }
  post: { tags: [Media], summary: Add a sticker, operationId: addSticker, security: *secure, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [image], properties: { image: { type: string, format: byte } } } } } }, responses: { '201': { description: Added sticker } } }
  delete: { tags: [Media], summary: Delete a sticker pack, operationId: deleteStickerPack, security: *secure, responses: { '200': { description: Deleted pack } } }
/stickers/{stickerId}:
  delete: { tags: [Media], summary: Delete a sticker, operationId: deleteSticker, security: *secure, parameters: [{ name: stickerId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Deleted sticker } } }
