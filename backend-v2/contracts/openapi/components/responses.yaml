Error:
  description: Request failed
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
FileTooLarge:
  description: Media payload exceeds the configured upload limit
  content:
    application/json:
      schema:
        type: object
        required: [error]
        properties:
          error:
            allOf:
              - { $ref: './schemas.yaml#/Error' }
              - type: object
                properties:
                  code: { type: string, enum: [file_too_large] }
      example:
        error:
          code: file_too_large
          message: file exceeds 100 MB limit
RateLimited:
  description: >-
    Too many requests. Returned with code rate_limited when a limit is
    exceeded (MLS routes: per user; GET /mls/keypackages/{userId}: also per
    requester-target pair and per target user). Retry after the delay given in
    Retry-After.
  headers:
    Retry-After:
      description: Seconds to wait before retrying (integer, at least 1).
      schema: { type: integer, minimum: 1 }
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        code: rate_limited
        message: too many requests
CryptoBusy:
  description: >-
    The crypto service is at its limit of concurrent requests (code
    crypto_busy) or unreachable (code crypto_unavailable). The request changed
    nothing; retry after the delay given in Retry-After.
  headers:
    Retry-After:
      description: Seconds to wait before retrying (integer, at least 1). Present for crypto_busy.
      schema: { type: integer, minimum: 1 }
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        code: crypto_busy
        message: crypto service is busy
