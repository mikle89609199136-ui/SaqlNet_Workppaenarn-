Error:
  type: object
  required: [code, message, requestId]
  properties:
    code: { type: string, example: validation_failed }
    message: { type: string, example: invalid input }
    requestId: { type: string }
User:
  type: object
  required: [id, username, firstName]
  properties:
    id: { type: string, format: uuid }
    username: { type: string }
    firstName: { type: string }
    lastName: { type: string }
    language: { type: string }
    bio: { type: string }
    avatarUrl: { type: string }
Password:
  # Требования задаёт internal/auth/password_validator.go и применяет во
  # всех трёх местах, где пароль задаётся: регистрация, смена, включение
  # второго пароля. Нарушение любого из них возвращает 400 weak_password.
  type: string
  format: password
  minLength: 10
  maxLength: 64
  description: >-
    At least 10 and at most 64 characters, counted in runes.
    Must contain a digit and one of !@#$%^&*()_+-=[]{}|;:'",.<>/?`~
    Whitespace is not allowed anywhere in the value.
  example: parolproba1!
RegisterRequest:
  type: object
  required: [username, password, firstName]
  properties:
    username: { $ref: '#/Username' }
    password: { $ref: '#/Password' }
    firstName: { type: string, minLength: 1 }
    lastName: { type: string }
    language: { type: string }
LoginRequest:
  type: object
  required: [username, password]
  properties:
    username: { type: string }
    password: { type: string, format: password }
    twoFAPassword: { type: string, format: password }
AuthResponse:
  type: object
  required: [user, token]
  properties:
    user: { $ref: '#/User' }
    token: { type: string }
Success:
  type: object
  required: [success]
  properties:
    success: { type: boolean, enum: [true] }
UpdateProfileRequest:
  type: object
  properties:
    firstName: { type: string }
    lastName: { type: string }
    bio: { type: string }
    avatarUrl: { type: string }
Chat:
  type: object
  required: [id, type]
  properties:
    id: { type: string, format: uuid }
    type: { type: string, enum: [private, group, channel] }
    title: { type: string }
    description: { type: string }
    avatarUrl: { type: string }
    ownerId: { type: string, format: uuid }
    role: { type: string }
    isPinned: { type: boolean }
    isArchived: { type: boolean }
    memberCount: { type: integer }
    createdAt: { type: string }
    updatedAt: { type: string }
ChatMember:
  allOf:
    - { $ref: '#/User' }
    - type: object
      properties:
        role: { type: string, enum: [owner, admin, member] }
        permissions: { type: object, additionalProperties: true }
        mutedUntil: { type: string, nullable: true }
        mutedAt:
          {
            type: string,
            nullable: true,
            description: 'set when muted; mutedUntil null = permanent mute',
          }
        joinedAt: { type: string }
Message:
  type: object
  required: [id, chatId, senderId, content, type, createdAt]
  properties:
    id: { type: string, format: uuid }
    chatId: { type: string, format: uuid }
    senderId: { type: string, format: uuid }
    content: { type: string }
    type: { type: string }
    replyTo: { type: string, format: uuid, nullable: true }
    metadata: { type: object, additionalProperties: true }
    isForwarded: { type: boolean }
    isPinned: { type: boolean }
    isEdited: { type: boolean }
    createdAt: { type: string }
    updatedAt: { type: string }
SendMessageRequest:
  type: object
  properties:
    content: { type: string }
    type: { type: string, default: text, enum: [text, image, audio, video, voice, sticker, gif, file] }
    replyTo: { type: string, format: uuid, nullable: true }
    mediaUrl: { type: string }
    mediaType: { type: string }
    fileName: { type: string, maxLength: 255 }
    sizeBytes: { type: integer, format: int64, minimum: 0, maximum: 104857600 }
    mediaEncrypted: { type: boolean }
    mediaEncryption: { type: object, additionalProperties: true }
    isEncrypted: { type: boolean }
EditMessageRequest:
  type: object
  required: [content]
  properties:
    content: { type: string }
Reaction:
  type: object
  properties:
    emoji: { type: string }
    count: { type: integer }
    myReaction: { type: boolean }
EncryptedMediaUploadRequest:
  type: object
  required: [purpose, file]
  description: |
    Encrypted media envelope v2. Unknown fields are ignored for server-first
    format rollouts. Missing required fields return validation_failed.
    Invalid sizeBytes returns invalid_size; invalid ciphertext returns
    invalid_ciphertext. Other invalid envelope fields return validation_failed.
  properties:
    purpose: { type: string, enum: [message] }
    fileName: { type: string, maxLength: 255, description: Fallback filename; at most 255 UTF-8 bytes. }
    file:
      type: object
      required: [encrypted, version, algorithm, iv, keyEpoch, sizeBytes, ciphertext]
      properties:
        encrypted: { type: boolean, enum: [true] }
        version: { type: integer, enum: [2] }
        algorithm: { type: string, enum: [AES-GCM] }
        iv:
          type: string
          maxLength: 4096
          pattern: '^[A-Za-z0-9+/]{16}$'
          description: Canonical standard base64 encoding of exactly 12 bytes; at most 4096 UTF-8 bytes.
        keyEpoch: { type: integer, minimum: 1, maximum: 9007199254740991 }
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Client plaintext size, preserved on upload and download; not the stored ciphertext size.
        ciphertext:
          type: string
          format: byte
          description: Standard base64 ciphertext; decoded size is limited by MAX_FILE_SIZE (413 file_too_large).
        mimeType:
          type: string
          maxLength: 255
          default: application/octet-stream
          description: At most 255 UTF-8 bytes. Empty or absent uses the default; no plain MIME allowlist applies.
        fileName:
          type: string
          maxLength: 255
          description: At most 255 UTF-8 bytes. Empty or absent uses the request filename, then filename sanitization applies.
UploadResponse:
  type: object
  required: [success, url]
  properties:
    success: { type: boolean }
    url: { type: string }
    encrypted: { type: boolean }
    encryption: {}
    fileName: { type: string }
    sizeBytes: { type: integer, format: int64 }
    contentType: { type: string }
Object:
  type: object
  additionalProperties: true
Username:
  type: string
  pattern: '^[a-zA-Z0-9_]{3,32}$'
  minLength: 3
  maxLength: 32
  example: 'john_doe'
