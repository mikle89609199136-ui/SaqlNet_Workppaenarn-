    deviceType:
      type: string
      nullable: true
      description: Session metadata is replaced on every registration. Omitted/null/empty string writes an empty value. No enum, address or length validator exists.
    userAgent:
      type: string
      nullable: true
      description: Session metadata is replaced on every registration. Omitted/null/empty string writes an empty value. No enum, address or length validator exists.
    clientIP:
      type: string
      nullable: true
      description: Session metadata is replaced on every registration. Omitted/null/empty string writes an empty value. No enum, address or length validator exists.

PushNotificationPayload:
  type: object
  additionalProperties: false
  required: [v, kind, chatId, chatType, actorName, lang, silent]
  description: >-
    Web Push v1 metadata, extended compatibly with an explicit silent boolean (#1042).
    No plaintext message, keys, full settings or subscription credentials are included.
    Global notifications=false suppresses delivery; personal chat mute suppresses message delivery only.
    Message silent follows sounds; call silent follows callSounds; missed_call is always silent.
    Updated workers show legacy payloads with absent/invalid silent quietly; older workers ignore the new
    property and must be updated to enforce sound policy. Browser fallback/ringtone remains #725.
  properties:
    v: { type: integer, enum: [1] }
    kind: { type: string, enum: [message, call, missed_call] }
    chatId: { type: string, format: uuid }
    chatType: { type: string, enum: [private, group, channel, self] }
    actorName: { type: string }
    chatTitle: { type: string, description: Omitted for private chats. }
    roomId: { type: string }
    callKind: { type: string }
    lang: { type: string }
    silent: { type: boolean, description: Effective server sound decision; false explicitly permits sound, true disables sound/vibration. }
PushVapidResponse:
  type: object
  required:
    - publicKey
  properties:
    publicKey:
      type: string
      description: Base64url encoded uncompressed P-256 point.

PushSubscriptionRequest:
  type: object
  required:
    - endpoint
    - keys
  properties:
    endpoint:
      type: string
      format: uri
      maxLength: 2048
      pattern: ^https://
      description: HTTPS URL without userinfo or explicit port, on the service allowlist in internal/push/subscription.go; checked server-side. At most 20 endpoints/account.
    keys:
      type: object
      required: [p256dh, auth]
      properties: {p256dh: {type: string, description: '65 decoded bytes, first byte 0x04; curve membership is not checked by this handler. Base64url or standard base64, padded or unpadded.'}, auth: {type: string, description: '16 decoded bytes; base64url or standard base64, padded or unpadded.'}}

PushSubscriptionResponse:
  type: object
  required:
    - id
  properties:
    id:
      type: string
      format: uuid

DeletePushSubscriptionRequest:
  type: object
  required:
    - endpoint
  properties:
    endpoint:
      type: string
      minLength: 1


