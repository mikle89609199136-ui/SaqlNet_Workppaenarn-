apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crypto-ingress
  namespace: craneapp-v2
spec:
  podSelector:
    matchLabels: { app: crypto }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { crypto-client: "true" }
      ports:
        - { protocol: TCP, port: 5005 }
