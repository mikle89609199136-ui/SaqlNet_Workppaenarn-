apiVersion: v1
kind: Namespace
metadata:
  name: craneapp-v2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto
  namespace: craneapp-v2
spec:
  replicas: 2
  selector:
    matchLabels: { app: crypto }
  template:
    metadata:
      labels: { app: crypto }
    spec:
      containers:
        - name: crypto
          image: craneapp/crypto:v2
          ports:
            - { name: http, containerPort: 5005 }
          env:
            - name: CRYPTO_SIGNING_SECRET
              valueFrom: { secretKeyRef: { name: crypto-secrets, key: signing-secret } }
            - name: CRYPTO_ENCRYPTION_SECRET
              valueFrom: { secretKeyRef: { name: crypto-secrets, key: encryption-secret } }
          readinessProbe: { httpGet: { path: /health/ready, port: http } }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: crypto
  namespace: craneapp-v2
spec:
  selector: { app: crypto }
  ports:
    - { name: http, port: 5005, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: craneapp-v2
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth, crypto-client: "true" }
    spec:
      initContainers:
        - name: require-auth-session-schema
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -ec
            - |
              until [ "$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
                SELECT CASE WHEN EXISTS (
                  SELECT 1
                  FROM public.schema_migrations
                  WHERE version = '0025_auth_token_generation.sql'
                ) AND EXISTS (
                  SELECT 1
                  FROM public.schema_migrations
                  WHERE version = '0035_auth_login_sessions.sql'
                ) AND EXISTS (
                  SELECT 1
                  FROM public.schema_migrations
                  WHERE version = '0036_auth_device_session_link.sql'
                ) AND EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'auth'
                    AND table_name = 'users'
                    AND column_name = 'token_generation'
                    AND data_type = 'bigint'
                    AND is_nullable = 'NO'
                    AND column_default IS NOT NULL
                ) AND EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'auth'
                    AND table_name = 'sessions'
                    AND column_name = 'access_token_hash'
                    AND data_type = 'text'
                ) AND EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'auth'
                    AND table_name = 'sessions'
                    AND column_name = 'token_generation'
                    AND data_type = 'bigint'
                    AND is_nullable = 'NO'
                    AND column_default IS NOT NULL
                ) AND EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'auth'
                    AND table_name = 'sessions'
                    AND column_name = 'device_session_id'
                    AND data_type = 'uuid'
                ) THEN 'ready' ELSE 'waiting' END
              " 2>/dev/null)" = "ready" ]; do
                echo "waiting for auth schema migrations 0025, 0035 and 0036"
                sleep 2
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: url
      containers:
        - name: auth
          image: craneapp/auth:v2
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - { name: CRYPTO_URL, value: "http://crypto:5005" }
            # Activate only after crypto and every token-validating service have
            # completed their generation-aware rollout. See docs/deployment.md.
            - { name: AUTH_LOGOUT_ALL_GENERATION_ENABLED, value: "false" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: database-secrets, key: url } }
          readinessProbe: { httpGet: { path: /health/ready, port: http } }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: craneapp-v2
spec:
  selector: { app: auth }
  ports:
    - { name: http, port: 8081, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: craneapp-v2
spec:
  replicas: 2
  selector:
    matchLabels: { app: edge }
  template:
    metadata:
      labels: { app: edge }
    spec:
      containers:
        - name: edge
          image: craneapp/edge:v2
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: AUTH_URL, value: "http://auth:8081" }
            - { name: USER_URL, value: "http://user:8082" }
            - { name: CHAT_URL, value: "http://chat:8083" }
            - { name: ALLOWED_ORIGINS, value: "https://web.craneapp.ru" }
          readinessProbe: { httpGet: { path: /health/live, port: http } }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: craneapp-v2
spec:
  selector: { app: edge }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: craneapp-v2
spec:
  # Calls keep live rooms and signaling in process memory (#713).
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: chat }
  template:
    metadata:
      labels: { app: chat, crypto-client: "true" }
    spec:
      initContainers:
        - name: require-auth-token-generation-schema
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -ec
            - |
              until [ "$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
                SELECT CASE WHEN EXISTS (
                  SELECT 1
                  FROM public.schema_migrations
                  WHERE version = '0025_auth_token_generation.sql'
                ) AND EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'auth'
                    AND table_name = 'users'
                    AND column_name = 'token_generation'
                    AND data_type = 'bigint'
                    AND is_nullable = 'NO'
                    AND column_default IS NOT NULL
                ) THEN 'ready' ELSE 'waiting' END
              " 2>/dev/null)" = "ready" ]; do
                echo "waiting for migration 0025_auth_token_generation.sql"
                sleep 2
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: url
      containers:
        - name: chat
          image: craneapp/chat:v2
          ports:
            - { name: http, containerPort: 8083 }
          env:
            - { name: CRYPTO_URL, value: "http://crypto:5005" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: database-secrets, key: url } }
          readinessProbe: { httpGet: { path: /health/ready, port: http } }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: chat
  namespace: craneapp-v2
spec:
  selector: { app: chat }
  ports:
    - { name: http, port: 8083, targetPort: http }
---
